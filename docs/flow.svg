<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 910" role="img" style="max-width:100%;height:auto;display:block"
       aria-label="Swimlane flowchart: the human appoints one orchestrator session, which claims a marker file; the human starts worker sessions manually; the orchestrator distributes handoff docs by path; inside a worker the result loops through a review subagent until clean, then the worker reports back and wraps itself; a hook announces each session's role on every message; the seat can be handed over or released.">
    <rect x="0" y="0" width="1180" height="910" rx="16" fill="#14181d"/>
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#c9d2d9"/></marker>
      <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#7fb8d9"/></marker>
      <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#e0a63f"/></marker>
    </defs>

    <!-- outer machine frame -->
    <rect x="8" y="8" width="1164" height="888" rx="14" fill="none" stroke="#3a4046" stroke-dasharray="7 5"/>
    <text x="26" y="30" font-size="11.5" fill="#8b949c" font-family="monospace" letter-spacing="2">THE MACHINE — ONE USER, MANY PARALLEL SESSIONS</text>

    <!-- ===== HUMAN lane ===== -->
    <rect x="28" y="44" width="1124" height="102" rx="10" fill="rgba(255,255,255,.025)" stroke="#4a5158"/>
    <text x="44" y="66" font-size="11" fill="#aab3ba" font-family="monospace" letter-spacing="2">HUMAN (YOU)</text>
    <rect x="60" y="78" width="200" height="50" rx="8" fill="rgba(13,142,207,.10)" stroke="#c9d2d9"/>
    <text x="160" y="99" font-size="12.5" fill="#e6ebef" text-anchor="middle">“you are the</text>
    <text x="160" y="115" font-size="12.5" fill="#e6ebef" text-anchor="middle">coordinator now”</text>
    <rect x="380" y="78" width="240" height="50" rx="8" fill="rgba(13,142,207,.10)" stroke="#c9d2d9" stroke-width="2.5"/>
    <text x="500" y="99" font-size="12.5" fill="#e6ebef" text-anchor="middle">starts worker sessions</text>
    <text x="500" y="115" font-size="12.5" fill="#e6ebef" text-anchor="middle">— always manually</text>
    <rect x="800" y="78" width="200" height="50" rx="8" fill="rgba(224,166,63,.08)" stroke="#c9d2d9"/>
    <text x="900" y="99" font-size="12.5" fill="#e6ebef" text-anchor="middle">appoints the</text>
    <text x="900" y="115" font-size="12.5" fill="#e6ebef" text-anchor="middle">next coordinator</text>

    <!-- ===== ORCHESTRATOR lane ===== -->
    <rect x="28" y="186" width="1124" height="204" rx="10" fill="rgba(13,142,207,.05)" stroke="#3e7ea0"/>
    <text x="44" y="208" font-size="11" fill="#8fd0ef" font-family="monospace" letter-spacing="2">ORCHESTRATOR SESSION</text>
    <text x="1136" y="208" font-size="10.5" fill="#8fd0ef" font-family="monospace" text-anchor="end">exactly one</text>
    <rect x="65" y="238" width="190" height="52" rx="8" fill="rgba(13,142,207,.14)" stroke="#8fd0ef"/>
    <text x="160" y="260" font-size="12.5" fill="#e6ebef" text-anchor="middle" font-family="monospace">/orchestrator claim</text>
    <text x="160" y="277" font-size="11" fill="#aab3ba" text-anchor="middle">takes the seat</text>
    <rect x="320" y="238" width="240" height="52" rx="8" fill="rgba(13,142,207,.14)" stroke="#8fd0ef"/>
    <text x="440" y="260" font-size="12.5" fill="#e6ebef" text-anchor="middle">plans with you,</text>
    <text x="440" y="277" font-size="12.5" fill="#e6ebef" text-anchor="middle">writes a handoff doc</text>
    <rect x="600" y="238" width="180" height="52" rx="8" fill="rgba(13,142,207,.14)" stroke="#8fd0ef" stroke-dasharray="5 4"/>
    <text x="690" y="260" font-size="12.5" fill="#e6ebef" text-anchor="middle">updates the board</text>
    <text x="690" y="277" font-size="11" fill="#aab3ba" text-anchor="middle">sole writer</text>
    <rect x="820" y="238" width="160" height="52" rx="8" fill="rgba(224,166,63,.10)" stroke="#8fd0ef"/>
    <text x="900" y="260" font-size="12.5" fill="#e6ebef" text-anchor="middle" font-family="monospace">release</text>
    <text x="900" y="277" font-size="11" fill="#aab3ba" text-anchor="middle">gives the seat back</text>
    <rect x="1010" y="238" width="130" height="52" rx="26" fill="rgba(255,255,255,.03)" stroke="#6b7379"/>
    <text x="1075" y="260" font-size="12" fill="#aab3ba" text-anchor="middle">regime OFF</text>
    <text x="1075" y="276" font-size="10.5" fill="#8b949c" text-anchor="middle">hook goes silent</text>
    <text x="60" y="376" font-size="11.5" fill="#8b949c" font-style="italic">small clear jobs run as sub-agents inside this session</text>

    <!-- ===== WORKER lane ===== -->
    <rect x="28" y="430" width="1124" height="210" rx="10" fill="rgba(255,255,255,.025)" stroke="#4a5158"/>
    <text x="44" y="452" font-size="11" fill="#aab3ba" font-family="monospace" letter-spacing="2">WORKER SESSIONS</text>
    <text x="1136" y="452" font-size="10.5" fill="#8b949c" font-family="monospace" text-anchor="end">every other living session</text>
    <!-- Worker A -->
    <rect x="110" y="466" width="628" height="134" rx="8" fill="rgba(255,255,255,.03)" stroke="#9aa3aa"/>
    <text x="126" y="486" font-size="11" fill="#aab3ba" font-family="monospace">WORKER A</text>
    <rect x="130" y="498" width="120" height="44" rx="7" fill="rgba(255,255,255,.04)" stroke="#c9d2d9"/>
    <text x="190" y="516" font-size="11.5" fill="#e6ebef" text-anchor="middle">reads the doc,</text>
    <text x="190" y="531" font-size="11.5" fill="#e6ebef" text-anchor="middle">does the work</text>
    <rect x="286" y="498" width="120" height="44" rx="7" fill="rgba(255,255,255,.04)" stroke="#c9d2d9"/>
    <text x="346" y="516" font-size="11.5" fill="#e6ebef" text-anchor="middle">spawns a review</text>
    <text x="346" y="531" font-size="11.5" fill="#e6ebef" text-anchor="middle">subagent</text>
    <rect x="442" y="498" width="120" height="44" rx="7" fill="rgba(255,255,255,.04)" stroke="#c9d2d9"/>
    <text x="502" y="516" font-size="11.5" fill="#e6ebef" text-anchor="middle">reports done/blocked</text>
    <text x="502" y="531" font-size="10" fill="#aab3ba" text-anchor="middle">unprompted, no polling</text>
    <rect x="598" y="498" width="120" height="44" rx="7" fill="rgba(255,255,255,.04)" stroke="#c9d2d9" stroke-dasharray="5 4"/>
    <text x="658" y="516" font-size="11.5" fill="#e6ebef" text-anchor="middle">wraps itself,</text>
    <text x="658" y="531" font-size="11.5" fill="#e6ebef" text-anchor="middle">then ends</text>
    <line x1="250" y1="520" x2="277" y2="520" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <line x1="406" y1="520" x2="433" y2="520" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <line x1="562" y1="520" x2="589" y2="520" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <!-- inner review loop -->
    <path d="M346 542 L346 566 L160 566 L160 546" fill="none" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <text x="253" y="586" font-size="10.5" fill="#8b949c" text-anchor="middle">review finds issues? fix and review again</text>
    <!-- Worker B ghost -->
    <rect x="800" y="466" width="260" height="134" rx="8" fill="none" stroke="#6b7379" stroke-dasharray="4 4" opacity=".8"/>
    <text x="816" y="486" font-size="11" fill="#8b949c" font-family="monospace">WORKER B … ×N</text>
    <text x="930" y="530" font-size="11.5" fill="#8b949c" text-anchor="middle">needs something Worker A found?</text>
    <text x="930" y="546" font-size="11.5" fill="#8b949c" text-anchor="middle">it arrives via the orchestrator</text>
    <!-- forbidden edge (anchored edge-to-edge) -->
    <line x1="738" y1="530" x2="800" y2="530" stroke="#e05f5f" stroke-width="1.6"/>
    <line x1="762" y1="519" x2="776" y2="541" stroke="#e05f5f" stroke-width="2.2"/>
    <line x1="776" y1="519" x2="762" y2="541" stroke="#e05f5f" stroke-width="2.2"/>
    <text x="769" y="560" font-size="11" fill="#e08585" text-anchor="middle">never directly</text>
    <text x="590" y="626" font-size="11.5" fill="#8b949c" text-anchor="middle">workers never message each other — everything routes through the middle lane</text>

    <!-- ===== hook band ===== -->
    <rect x="28" y="676" width="1124" height="64" rx="10" fill="rgba(13,142,207,.045)" stroke="#3e7ea0" stroke-dasharray="3 4"/>
    <text x="590" y="702" font-size="12" fill="#8fd0ef" text-anchor="middle" font-family="monospace">⟳  ON EVERY USER MESSAGE, INSIDE EVERY SESSION</text>
    <text x="590" y="722" font-size="12" fill="#c9d2d9" text-anchor="middle">the plugin’s hook reads marker + registry and prints that session’s role and rules — orchestrator, worker, or (no seat) nothing</text>

    <!-- ===== stores ===== -->
    <rect x="28" y="776" width="710" height="106" rx="10" fill="rgba(255,255,255,.02)" stroke="#4a5158"/>
    <text x="44" y="798" font-size="11" fill="#aab3ba" font-family="monospace" letter-spacing="2">PLUGIN STATE</text>
    <ellipse cx="126" cy="812" rx="58" ry="10" fill="rgba(224,166,63,.12)" stroke="#c9a25f"/>
    <rect x="68" y="812" width="116" height="34" fill="rgba(224,166,63,.12)" stroke="#c9a25f"/>
    <ellipse cx="126" cy="846" rx="58" ry="10" fill="rgba(224,166,63,.12)" stroke="#c9a25f"/>
    <text x="126" y="836" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">the marker</text>
    <text x="126" y="871" font-size="10" fill="#8b949c" text-anchor="middle">holds the coordinator’s session id</text>
    <rect x="193" y="810" width="150" height="48" rx="4" fill="rgba(255,255,255,.04)" stroke="#9aa3aa"/>
    <text x="268" y="830" font-size="11.5" fill="#e6ebef" text-anchor="middle">handoff doc</text>
    <text x="268" y="846" font-size="10" fill="#8b949c" text-anchor="middle">travels by path, not by message</text>
    <rect x="505" y="810" width="150" height="48" rx="4" fill="rgba(255,255,255,.04)" stroke="#9aa3aa"/>
    <text x="580" y="830" font-size="11.5" fill="#e6ebef" text-anchor="middle">status board</text>
    <text x="580" y="846" font-size="10" fill="#8b949c" text-anchor="middle">orchestrator writes · workers read</text>
    <rect x="768" y="776" width="384" height="106" rx="10" fill="none" stroke="#4a5158" stroke-dasharray="4 4" opacity=".85"/>
    <text x="784" y="798" font-size="11" fill="#8b949c" font-family="monospace" letter-spacing="2">CLAUDE CODE ITSELF — NOT THE PLUGIN</text>
    <ellipse cx="860" cy="812" rx="62" ry="10" fill="rgba(255,255,255,.03)" stroke="#6b7379"/>
    <rect x="798" y="812" width="124" height="34" fill="rgba(255,255,255,.03)" stroke="#6b7379"/>
    <ellipse cx="860" cy="846" rx="62" ry="10" fill="rgba(255,255,255,.03)" stroke="#6b7379"/>
    <text x="860" y="836" font-size="11" fill="#aab3ba" text-anchor="middle" font-family="monospace">session registry</text>
    <text x="860" y="871" font-size="10" fill="#8b949c" text-anchor="middle">who is alive right now</text>
    <text x="1040" y="823" font-size="11.5" fill="#aab3ba" text-anchor="middle">peer messaging</text>
    <text x="1040" y="839" font-size="10" fill="#8b949c" text-anchor="middle">carries steps 4·6·9</text>

    <!-- ===== numbered edges (orthogonal, clearances >= 2x arrowhead) ===== -->
    <!-- 1 human -> claim (center to center) -->
    <line x1="160" y1="128" x2="160" y2="234" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <circle cx="160" cy="170" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="160" y="174" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">1</text>
    <!-- 2 claim -> marker (left channel, 16px off every border) -->
    <path d="M160 290 L160 330 L44 330 L44 829 L64 829" fill="none" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)"/>
    <circle cx="44" cy="412" r="10" fill="#22282d" stroke="#7fb8d9"/><text x="44" y="416" font-size="11" fill="#8fd0ef" text-anchor="middle" font-family="monospace">2</text>
    <text x="58" y="416" font-size="10.5" fill="#8b949c">writes its session id</text>
    <!-- 3 band -> lanes -->
    <line x1="1090" y1="676" x2="1090" y2="644" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)"/>
    <line x1="1120" y1="676" x2="1120" y2="394" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)"/>
    <circle cx="1120" cy="560" r="10" fill="#22282d" stroke="#7fb8d9"/><text x="1120" y="564" font-size="11" fill="#8fd0ef" text-anchor="middle" font-family="monospace">3</text>
    <!-- 4 human -> workers (thick, manual) -->
    <path d="M380 103 L300 103 L300 462" fill="none" stroke="#c9d2d9" stroke-width="2.5" marker-end="url(#ar)"/>
    <path d="M560 128 L560 166 L930 166 L930 462" fill="none" stroke="#c9d2d9" stroke-width="2.5" marker-end="url(#ar)"/>
    <circle cx="340" cy="103" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="340" y="107" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">4</text>
    <!-- 5 plan <-> human (straight: H4 quarter-left = plans top-center = x440) -->
    <line x1="440" y1="132" x2="440" y2="234" stroke="#c9d2d9" marker-end="url(#ar)" marker-start="url(#ar)"/>
    <circle cx="440" cy="180" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="440" y="184" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">5</text>
    <!-- dashed: orchestrator writes the handoff doc -->
    <path d="M380 290 L380 414 L268 414 L268 806" fill="none" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)" opacity=".7"/>
    <!-- 6 orchestrator -> worker A: peer msg with PATH -->
    <path d="M440 290 L440 406 L190 406 L190 462" fill="none" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <circle cx="190" cy="436" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="190" y="440" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">6</text>
    <text x="245" y="400" font-size="10.5" fill="#8b949c" text-anchor="middle">the doc’s PATH</text>
    <!-- 7 worker reads doc -->
    <path d="M190 600 L190 758 L231 758 L231 806" fill="none" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)" opacity=".7"/>
    <circle cx="190" cy="636" r="10" fill="#22282d" stroke="#7fb8d9"/><text x="190" y="640" font-size="11" fill="#8fd0ef" text-anchor="middle" font-family="monospace">7</text>
    <!-- 8 badge on forbidden edge -->
    <circle cx="769" cy="505" r="10" fill="#22282d" stroke="#e05f5f"/><text x="769" y="509" font-size="11" fill="#e08585" text-anchor="middle" font-family="monospace">8</text>
    <!-- 9 worker -> orchestrator (board card) -->
    <path d="M502 466 L502 414 L645 414 L645 294" fill="none" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <circle cx="502" cy="440" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="502" y="444" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">9</text>
    <!-- 10 board write + worker read -->
    <path d="M690 290 L690 406 L580 406 L580 806" fill="none" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)" opacity=".7"/>
    <circle cx="690" cy="368" r="10" fill="#22282d" stroke="#7fb8d9"/><text x="690" y="372" font-size="11" fill="#8fd0ef" text-anchor="middle" font-family="monospace">10</text>
    <path d="M930 600 L930 758 L618 758 L618 806" fill="none" stroke="#7fb8d9" stroke-dasharray="2 5" marker-end="url(#arb)" opacity=".5"/>
    <text x="700" y="750" font-size="10" fill="#8b949c">read-only</text>
    <!-- 11 badge above wrap card -->
    <circle cx="658" cy="487" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="658" y="491" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">11</text>
    <!-- 12 handover -->
    <line x1="900" y1="128" x2="900" y2="234" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <circle cx="900" cy="170" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="900" y="174" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">12</text>
    <line x1="980" y1="264" x2="1006" y2="264" stroke="#6b7379" marker-end="url(#ar)"/>
    <text x="994" y="306" font-size="9.5" fill="#8b949c" text-anchor="middle">no successor</text>
    <path d="M860 290 L860 336 L208 336 L208 294" fill="none" stroke="#e0a63f" stroke-width="1.8" marker-end="url(#arw)"/>
    <text x="790" y="354" font-size="11" fill="#e0a63f" text-anchor="middle">or: the successor claims — cycle restarts at ②</text>
  </svg>