<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 872" role="img" style="max-width:100%;height:auto;display:block"
       aria-label="Swimlane flowchart: the human appoints one orchestrator session, which claims a marker file; the human starts worker sessions manually; the orchestrator distributes handoff docs by path, workers report back and wrap themselves; a hook announces each session's role on every message; the seat can be handed over or released.">
    <rect x="0" y="0" width="1180" height="872" rx="16" fill="#14181d"/>
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#c9d2d9"/></marker>
      <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#7fb8d9"/></marker>
      <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#e0a63f"/></marker>
    </defs>

    <!-- outer machine frame -->
    <rect x="8" y="8" width="1164" height="856" rx="14" fill="none" stroke="#3a4046" stroke-dasharray="7 5"/>
    <text x="26" y="30" font-size="11.5" fill="#8b949c" font-family="monospace" letter-spacing="2">THE MACHINE — ONE USER, MANY PARALLEL SESSIONS</text>

    <!-- ===== HUMAN lane ===== -->
    <rect x="28" y="44" width="1124" height="102" rx="10" fill="rgba(255,255,255,.025)" stroke="#4a5158"/>
    <text x="44" y="66" font-size="11" fill="#aab3ba" font-family="monospace" letter-spacing="2">HUMAN (YOU)</text>
    <rect x="60" y="78" width="200" height="50" rx="8" fill="rgba(13,142,207,.10)" stroke="#c9d2d9"/>
    <text x="160" y="99" font-size="12.5" fill="#e6ebef" text-anchor="middle">“you are the</text>
    <text x="160" y="115" font-size="12.5" fill="#e6ebef" text-anchor="middle">coordinator now”</text>
    <rect x="380" y="78" width="240" height="50" rx="8" fill="rgba(13,142,207,.10)" stroke="#c9d2d9" stroke-width="2.5"/>
    <text x="500" y="99" font-size="12.5" fill="#e6ebef" text-anchor="middle">starts worker sessions</text>
    <text x="500" y="115" font-size="12.5" fill="#e6ebef" text-anchor="middle">— always manually</text>
    <rect x="800" y="78" width="200" height="50" rx="8" fill="rgba(224,166,63,.08)" stroke="#c9d2d9"/>
    <text x="900" y="99" font-size="12.5" fill="#e6ebef" text-anchor="middle">appoints the</text>
    <text x="900" y="115" font-size="12.5" fill="#e6ebef" text-anchor="middle">next coordinator</text>

    <!-- ===== ORCHESTRATOR lane ===== -->
    <rect x="28" y="186" width="1124" height="204" rx="10" fill="rgba(13,142,207,.05)" stroke="#3e7ea0"/>
    <text x="44" y="208" font-size="11" fill="#8fd0ef" font-family="monospace" letter-spacing="2">ORCHESTRATOR SESSION</text>
    <text x="1136" y="208" font-size="10.5" fill="#8fd0ef" font-family="monospace" text-anchor="end">exactly one</text>
    <rect x="60" y="238" width="190" height="52" rx="8" fill="rgba(13,142,207,.14)" stroke="#8fd0ef"/>
    <text x="155" y="260" font-size="12.5" fill="#e6ebef" text-anchor="middle" font-family="monospace">/orchestrator claim</text>
    <text x="155" y="277" font-size="11" fill="#aab3ba" text-anchor="middle">takes the seat</text>
    <rect x="320" y="238" width="220" height="52" rx="8" fill="rgba(13,142,207,.14)" stroke="#8fd0ef"/>
    <text x="430" y="260" font-size="12.5" fill="#e6ebef" text-anchor="middle">plans with you,</text>
    <text x="430" y="277" font-size="12.5" fill="#e6ebef" text-anchor="middle">writes a handoff doc</text>
    <rect x="600" y="238" width="180" height="52" rx="8" fill="rgba(13,142,207,.14)" stroke="#8fd0ef" stroke-dasharray="5 4"/>
    <text x="690" y="260" font-size="12.5" fill="#e6ebef" text-anchor="middle">updates the board</text>
    <text x="690" y="277" font-size="11" fill="#aab3ba" text-anchor="middle">sole writer</text>
    <rect x="820" y="238" width="160" height="52" rx="8" fill="rgba(224,166,63,.10)" stroke="#8fd0ef"/>
    <text x="900" y="260" font-size="12.5" fill="#e6ebef" text-anchor="middle" font-family="monospace">release</text>
    <text x="900" y="277" font-size="11" fill="#aab3ba" text-anchor="middle">gives the seat back</text>
    <rect x="1010" y="238" width="130" height="52" rx="26" fill="rgba(255,255,255,.03)" stroke="#6b7379"/>
    <text x="1075" y="260" font-size="12" fill="#aab3ba" text-anchor="middle">regime OFF</text>
    <text x="1075" y="276" font-size="10.5" fill="#8b949c" text-anchor="middle">hook goes silent</text>
    <text x="330" y="348" font-size="11.5" fill="#8b949c" font-style="italic">small clear jobs run as sub-agents inside this session — they are not worker sessions</text>

    <!-- ===== WORKER lane ===== -->
    <rect x="28" y="430" width="1124" height="196" rx="10" fill="rgba(255,255,255,.025)" stroke="#4a5158"/>
    <text x="44" y="452" font-size="11" fill="#aab3ba" font-family="monospace" letter-spacing="2">WORKER SESSIONS</text>
    <text x="1136" y="452" font-size="10.5" fill="#8b949c" font-family="monospace" text-anchor="end">every other living session</text>
    <!-- Worker A -->
    <rect x="110" y="466" width="530" height="118" rx="8" fill="rgba(255,255,255,.03)" stroke="#9aa3aa"/>
    <text x="126" y="486" font-size="11" fill="#aab3ba" font-family="monospace">WORKER A</text>
    <rect x="130" y="498" width="150" height="44" rx="7" fill="rgba(255,255,255,.04)" stroke="#c9d2d9"/>
    <text x="205" y="516" font-size="12" fill="#e6ebef" text-anchor="middle">reads the doc,</text>
    <text x="205" y="531" font-size="12" fill="#e6ebef" text-anchor="middle">does the work</text>
    <rect x="310" y="498" width="150" height="44" rx="7" fill="rgba(255,255,255,.04)" stroke="#c9d2d9"/>
    <text x="385" y="516" font-size="12" fill="#e6ebef" text-anchor="middle">reports done/blocked</text>
    <text x="385" y="531" font-size="11" fill="#aab3ba" text-anchor="middle">unprompted, no polling</text>
    <rect x="490" y="498" width="130" height="44" rx="7" fill="rgba(255,255,255,.04)" stroke="#c9d2d9" stroke-dasharray="5 4"/>
    <text x="555" y="516" font-size="12" fill="#e6ebef" text-anchor="middle">wraps itself,</text>
    <text x="555" y="531" font-size="12" fill="#e6ebef" text-anchor="middle">then ends ⏹</text>
    <line x1="280" y1="520" x2="303" y2="520" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <line x1="460" y1="520" x2="483" y2="520" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <!-- Worker B ghost -->
    <rect x="740" y="466" width="260" height="118" rx="8" fill="none" stroke="#6b7379" stroke-dasharray="4 4" opacity=".8"/>
    <text x="756" y="486" font-size="11" fill="#8b949c" font-family="monospace">WORKER B … ×N</text>
    <text x="870" y="530" font-size="11.5" fill="#8b949c" text-anchor="middle">needs something Worker A found?</text>
    <text x="870" y="546" font-size="11.5" fill="#8b949c" text-anchor="middle">it arrives via the orchestrator</text>
    <!-- forbidden edge -->
    <line x1="646" y1="525" x2="734" y2="525" stroke="#e05f5f" stroke-width="1.6"/>
    <line x1="683" y1="514" x2="697" y2="536" stroke="#e05f5f" stroke-width="2.2"/>
    <line x1="697" y1="514" x2="683" y2="536" stroke="#e05f5f" stroke-width="2.2"/>
    <text x="690" y="558" font-size="11" fill="#e08585" text-anchor="middle">never directly</text>
    <text x="690" y="608" font-size="11.5" fill="#8b949c" text-anchor="middle">workers never message each other — everything routes through the middle lane</text>

    <!-- ===== hook band ===== -->
    <rect x="28" y="650" width="1124" height="64" rx="10" fill="rgba(13,142,207,.045)" stroke="#3e7ea0" stroke-dasharray="3 4"/>
    <text x="590" y="676" font-size="12" fill="#8fd0ef" text-anchor="middle" font-family="monospace">⟳  ON EVERY USER MESSAGE, INSIDE EVERY SESSION</text>
    <text x="590" y="696" font-size="12" fill="#c9d2d9" text-anchor="middle">the plugin’s hook reads marker + registry and prints that session’s role and rules — orchestrator, worker, or (no seat) nothing</text>

    <!-- ===== stores ===== -->
    <rect x="28" y="738" width="710" height="106" rx="10" fill="rgba(255,255,255,.02)" stroke="#4a5158"/>
    <text x="44" y="760" font-size="11" fill="#aab3ba" font-family="monospace" letter-spacing="2">PLUGIN STATE — FILES ON DISK</text>
    <ellipse cx="120" cy="782" rx="58" ry="10" fill="rgba(224,166,63,.12)" stroke="#c9a25f"/>
    <rect x="62" y="782" width="116" height="34" fill="rgba(224,166,63,.12)" stroke="#c9a25f"/>
    <ellipse cx="120" cy="816" rx="58" ry="10" fill="rgba(224,166,63,.12)" stroke="#c9a25f"/>
    <text x="120" y="806" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">the marker</text>
    <text x="120" y="837" font-size="10" fill="#8b949c" text-anchor="middle">holds the coordinator’s session id</text>
    <rect x="300" y="772" width="150" height="48" rx="4" fill="rgba(255,255,255,.04)" stroke="#9aa3aa"/>
    <text x="375" y="792" font-size="11.5" fill="#e6ebef" text-anchor="middle">handoff doc</text>
    <text x="375" y="808" font-size="10" fill="#8b949c" text-anchor="middle">travels by path, not by message</text>
    <rect x="520" y="772" width="150" height="48" rx="4" fill="rgba(255,255,255,.04)" stroke="#9aa3aa"/>
    <text x="595" y="792" font-size="11.5" fill="#e6ebef" text-anchor="middle">status board</text>
    <text x="595" y="808" font-size="10" fill="#8b949c" text-anchor="middle">orchestrator writes · workers read</text>
    <rect x="768" y="738" width="384" height="106" rx="10" fill="none" stroke="#4a5158" stroke-dasharray="4 4" opacity=".85"/>
    <text x="784" y="760" font-size="11" fill="#8b949c" font-family="monospace" letter-spacing="2">CLAUDE CODE ITSELF — NOT THE PLUGIN</text>
    <ellipse cx="860" cy="782" rx="62" ry="10" fill="rgba(255,255,255,.03)" stroke="#6b7379"/>
    <rect x="798" y="782" width="124" height="34" fill="rgba(255,255,255,.03)" stroke="#6b7379"/>
    <ellipse cx="860" cy="816" rx="62" ry="10" fill="rgba(255,255,255,.03)" stroke="#6b7379"/>
    <text x="860" y="806" font-size="11" fill="#aab3ba" text-anchor="middle" font-family="monospace">session registry</text>
    <text x="860" y="837" font-size="10" fill="#8b949c" text-anchor="middle">who is alive right now</text>
    <text x="1040" y="795" font-size="11.5" fill="#aab3ba" text-anchor="middle">peer messaging</text>
    <text x="1040" y="811" font-size="10" fill="#8b949c" text-anchor="middle">carries steps 4·6·7</text>

    <!-- ===== numbered edges ===== -->
    <!-- 1 human -> claim -->
    <line x1="160" y1="128" x2="157" y2="232" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <circle cx="146" cy="170" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="146" y="174" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">1</text>
    <!-- 2 claim -> marker (left channel) -->
    <path d="M70 290 L46 290 L46 776 L58 776" fill="none" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)"/>
    <circle cx="46" cy="420" r="10" fill="#22282d" stroke="#7fb8d9"/><text x="46" y="424" font-size="11" fill="#8fd0ef" text-anchor="middle" font-family="monospace">2</text>
    <text x="60" y="424" font-size="10.5" fill="#8b949c">writes its session id</text>
    <!-- 3 band -> lanes -->
    <line x1="1090" y1="650" x2="1090" y2="632" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)"/>
    <path d="M1120 650 L1120 396" fill="none" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)"/>
    <circle cx="1120" cy="560" r="10" fill="#22282d" stroke="#7fb8d9"/><text x="1120" y="564" font-size="11" fill="#8fd0ef" text-anchor="middle" font-family="monospace">3</text>
    <!-- 4 human -> workers (thick, manual) -->
    <path d="M470 128 L300 128 L215 462" fill="none" stroke="#c9d2d9" stroke-width="2.5" marker-end="url(#ar)"/>
    <path d="M560 128 L856 462" fill="none" stroke="#c9d2d9" stroke-width="2.5" marker-end="url(#ar)"/>
    <circle cx="268" cy="150" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="268" y="154" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">4</text>
    <!-- 5 plan <-> human, doc write -->
    <line x1="430" y1="238" x2="430" y2="150" stroke="#c9d2d9" marker-end="url(#ar)" marker-start="url(#ar)"/>
    <circle cx="430" cy="196" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="430" y="200" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">5</text>
    <path d="M352 290 L352 420 L375 420 L375 768" fill="none" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)" opacity=".7"/>
    <!-- 6 orchestrator -> worker A: peer msg with PATH -->
    <line x1="266" y1="290" x2="212" y2="494" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <circle cx="229" cy="412" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="229" y="416" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">6</text>
    <text x="246" y="416" font-size="10.5" fill="#8b949c">peer message: the doc’s PATH — never its content</text>
    <!-- 7 worker reads doc -->
    <path d="M205 542 L205 630 L340 630 L340 768" fill="none" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)" opacity=".7"/>
    <circle cx="205" cy="586" r="10" fill="#22282d" stroke="#7fb8d9"/><text x="205" y="590" font-size="11" fill="#8fd0ef" text-anchor="middle" font-family="monospace">7</text>
    <!-- 8 badge on forbidden edge -->
    <circle cx="646" cy="510" r="10" fill="#22282d" stroke="#e05f5f"/><text x="646" y="514" font-size="11" fill="#e08585" text-anchor="middle" font-family="monospace">8</text>
    <!-- 9 worker -> orchestrator -->
    <line x1="400" y1="494" x2="480" y2="294" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <circle cx="443" cy="392" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="443" y="396" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">9</text>
    <!-- 10 board write + worker read -->
    <path d="M690 290 L690 420 L620 420 L620 768" fill="none" stroke="#7fb8d9" stroke-dasharray="5 4" marker-end="url(#arb)" opacity=".7"/>
    <circle cx="690" cy="380" r="10" fill="#22282d" stroke="#7fb8d9"/><text x="690" y="384" font-size="11" fill="#8fd0ef" text-anchor="middle" font-family="monospace">10</text>
    <path d="M595 768 L595 740 L660 718 L740 640 L780 588" fill="none" stroke="#7fb8d9" stroke-dasharray="2 5" marker-end="url(#arb)" opacity=".45"/>
    <text x="700" y="734" font-size="10" fill="#8b949c">read-only</text>
    <!-- 11 badge on wrap node -->
    <circle cx="490" cy="486" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="490" y="490" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">11</text>
    <!-- 12 handover -->
    <line x1="900" y1="128" x2="900" y2="232" stroke="#c9d2d9" marker-end="url(#ar)"/>
    <circle cx="912" cy="170" r="10" fill="#22282d" stroke="#c9d2d9"/><text x="912" y="174" font-size="11" fill="#e6ebef" text-anchor="middle" font-family="monospace">12</text>
    <line x1="984" y1="264" x2="1004" y2="264" stroke="#6b7379" marker-end="url(#ar)"/>
    <text x="994" y="306" font-size="9.5" fill="#8b949c" text-anchor="middle">no successor</text>
    <path d="M860 232 C 700 188, 340 188, 260 242" fill="none" stroke="#e0a63f" stroke-width="1.8" marker-end="url(#arw)"/>
    <text x="520" y="222" font-size="11" fill="#e0a63f" text-anchor="middle">or: the successor claims — cycle restarts at ②</text>
  </svg>